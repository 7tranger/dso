name: Security - SBOM & SCA

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/ci-sbom-sca.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom_sca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P09

      - name: Generate SBOM (Syft CycloneDX)
        run: |
          docker run --rm -v "${{ github.workspace }}":/work -w /work anchore/syft:1.17.0 \
            packages dir:. -o cyclonedx-json > EVIDENCE/P09/sbom.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Add git metadata to SBOM
        run: |
          commit_sha="${GITHUB_SHA}"
          repo="${GITHUB_REPOSITORY}"

          jq --arg sha "$commit_sha" --arg repo "$repo" '
            .metadata |= (. // {}) |
            .metadata.properties |= ((. // []) + [
              {"name": "git.commit", "value": $sha},
              {"name": "git.repository", "value": $repo}
            ])
          ' EVIDENCE/P09/sbom.json > EVIDENCE/P09/sbom.tmp

          mv EVIDENCE/P09/sbom.tmp EVIDENCE/P09/sbom.json

      - name: SCA Scan (Grype)
        shell: bash
        run: |
          set -e
          docker run --rm -v "${{ github.workspace }}":/work -w /work anchore/grype:0.78.0 \
            sbom:/work/EVIDENCE/P09/sbom.json -o json > EVIDENCE/P09/sca_report.json
          echo "# SCA summary" > EVIDENCE/P09/sca_summary.md
          jq '[.matches[].vulnerability.severity] | group_by(.) | map({(.[0]): length}) | add' \
            EVIDENCE/P09/sca_report.json >> EVIDENCE/P09/sca_summary.md || true

      - name: Upload SBOM/SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P09_EVIDENCE
          path: EVIDENCE/P09
